# ============================================================================
#  gradle.properties — KehadiranPro
#
#  NOTE: hermesEnabled lives HERE, not in android/app/build.gradle.
#  (The brief said build.gradle; that is a common misconception. The RN Gradle
#  plugin reads this property and swaps react-android's JS engine dependency,
#  so a stray "hermesEnabled" line in build.gradle would do nothing.)
# ============================================================================

# --- Hermes: the whole point of this build -------------------------------
hermesEnabled=true
# New Architecture (Fabric/TurboModules) OFF: RN 0.73 + Hermes + old arch is
# the smallest, most battle-tested combination for cheap Android hardware.
newArchEnabled=false

# --- AndroidX ------------------------------------------------------------
android.useAndroidX=true
android.enableJetifier=true

# --- Build performance ---------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
android.nonTransitiveRClass=true

# --- App identity for release signing ------------------------------------
# Create android/keystore.properties (git-ignored) before building for Play:
#   KEPASS_STORE_FILE=kehadiranpro-release.keystore
#   KEPASS_STORE_PASSWORD=********
#   KEPASS_KEY_ALIAS=kehadiranpro
#   KEPASS_KEY_PASSWORD=********
# Without it, release builds fall back to the debug keystore so that
# `./gradlew bundleRelease` still produces an installable artifact.
