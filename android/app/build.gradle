apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// ---------------------------------------------------------------------------
// react-native-vector-icons: copies the MaterialIcons .ttf into assets/fonts
// at build time. WITHOUT this line the icons are empty boxes in a RELEASE
// build (debug picks them up from the JS dev server / bundled assets by luck).
// ---------------------------------------------------------------------------
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

/**
 * React Native Gradle Plugin configuration.
 * Hermes bytecode compilation happens here (com.facebook.react plugin runs
 * the bundled hermesc with -O), NOT in Metro.
 */
react {
    /* Folders */
    // root = file("../")
    // reactNativeDir = file("../node_modules/react-native")
    // codegenDir = file("../node_modules/@react-native/codegen")
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    debuggableVariants = ["debug"]

    /* Hermes Commands */
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

// Release signing: keystore.properties wins, debug keystore is the fallback so
// CI/`bundleRelease` cannot fail just because a clerk has not made a keystore.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeystore = keystoreProperties.containsKey("KEPASS_STORE_FILE")
}

// versionCode/versionName can be overridden from the command line so CI can
// derive a monotonic code from the run number:
//   ./gradlew bundleRelease -PversionCode=1042 -PversionName=1.4.2
def appVersionCode = (findProperty("versionCode") ?: 1) as Integer
def appVersionName = (findProperty("versionName") ?: "1.0.0") as String

// R8 off by default: one bad keep-rule crashes a release build in the field,
// and this app's native surface is tiny. Flip to true (and add keep rules for
// react-native-share / react-native-fs) only if APK size becomes critical.
def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.kehadiranpro"

    defaultConfig {
        applicationId "com.kehadiranpro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
    }

    // Per-ABI APKs (8-10 MB each instead of one 15-20 MB universal APK).
    // Enable with -PenableSeparateApk=true when distributing by direct APK.
    if (project.hasProperty("enableSeparateApk")) {
        splits {
            abi {
                reset()
                enable true
                universalApk false
                include "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasKeystore) {
                storeFile file(keystoreProperties["KEPASS_STORE_FILE"])
                storePassword keystoreProperties["KEPASS_STORE_PASSWORD"]
                keyAlias keystoreProperties["KEPASS_KEY_ALIAS"]
                keyPassword keystoreProperties["KEPASS_KEY_PASSWORD"]
            } else {
                // TODO: replace with a real upload keystore before Play Store.
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            // R8 off by default: one bad keep-rule crashes a release build in
            // the field and this app's only native deps are already small.
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        // Hermes ships one libhermes.so per ABI; do not let packaging duplicate
        // them (that alone is ~2 MB of dead weight in a universal APK).
        jniLibs {
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // The JS engine pair: react-android + hermes-android == Hermes enabled.
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // Needed by <RefreshControl> in Rekod.js on some OEM ROMs.
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
}
